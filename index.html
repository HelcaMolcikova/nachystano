<!doctype html>
<html lang="cs" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nachystáno">
<meta name="theme-color" content="#F8F6FB">
<meta name="color-scheme" content="light dark">
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('kajin-tema') === 'dark' ? 'dark' : 'light'; } catch {}
</script>
<title>Nachystáno</title>
<style>
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#18241F; --muted:#64716B; --line:#E1E6E1; --line2:#CDD5CF;
  --btn:#18241F; --btn-ink:#FFFFFF;
  --snid:#6C9A2E; --obed:#D9472D; --obed2:#2F8C7E; --vec:#9A6436;
  --seda:#A3ADA7; --ok:#2F8A56; --warn:#B15E0C; --note:#FFE58A; --note-ink:#3D3209;
  --tint:12%;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#18211D; --ink:#E8EEEA; --muted:#97A59E; --line:#26312C; --line2:#34413A;
    --btn:#E8EEEA; --btn-ink:#0F1613;
    --snid:#93C152; --obed:#F0674C; --obed2:#4DB3A3; --vec:#CF915C;
    --seda:#6F7C76; --ok:#5DBE84; --warn:#E89A4C; --note:#E9CD6A; --note-ink:#2E2507; --tint:20%;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#18211D; --ink:#E8EEEA; --muted:#97A59E; --line:#26312C; --line2:#34413A;
  --btn:#E8EEEA; --btn-ink:#0F1613;
  --snid:#93C152; --obed:#F0674C; --obed2:#4DB3A3; --vec:#CF915C;
  --seda:#6F7C76; --ok:#5DBE84; --warn:#E89A4C; --note:#E9CD6A; --note-ink:#2E2507; --tint:20%;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--font);font-optical-sizing:auto;
  padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.025em}
h2{font-size:22px;line-height:1.15;letter-spacing:-.015em;margin:34px 0 12px}
h3{font-size:18px;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 28px}
.muted{color:var(--muted)}
.small{font-size:15px}
.tiny{font-size:13px}
.top{margin:14px 0 22px}
.top .sub{margin:6px 0 0;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;background:var(--btn);color:var(--btn-ink);font-weight:650;border-radius:var(--r-sm);padding:14px 18px;min-height:54px;width:100%;text-align:center;font-size:17px}
.btn.line{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn[disabled]{opacity:.35;cursor:default}
.link{color:var(--ink);font-weight:650;text-decoration:underline;text-decoration-color:var(--line2);text-decoration-thickness:2px;text-underline-offset:4px}
.pair{display:flex;gap:10px;margin-top:22px}
.pair .btn.line{flex:0 0 34%}

/* úvod */
.hello{margin:18px 0 16px}
.hello .date{margin:0 0 4px;color:var(--muted);font-size:15px;font-weight:500}
.hello h1{font-size:40px}
.listek{background:var(--note);color:var(--note-ink);border-radius:var(--r-md);padding:18px 18px 16px;margin:0 0 8px}
.listek .motto{margin:0;font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em;max-width:34ch}
.listek .streak{margin:10px 0 0;font-size:15px;font-weight:600}
.listek .od{margin:14px 0 0;font-size:14px;opacity:.75}

/* souhrn dne */
.sum{margin:6px 0 4px}
.top-sum{background:var(--surface);border-radius:var(--r-md);padding:16px;margin:0 0 10px}
.kc{margin:0;font-size:15px;color:var(--muted)}
.kc b{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-right:2px}
.kc.off b{color:var(--warn)}
.meter{position:relative;display:flex;gap:3px;height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 10px}
.meter i{display:block;height:100%;background:var(--c);flex:none}
.meter i:first-child{border-radius:6px 0 0 6px}
.meter .goal{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.mac{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.mac b{color:var(--ink);font-weight:650}

/* jídlo dne */
.box{--c:var(--seda);position:relative;display:flex;align-items:center;gap:14px;background:var(--surface);
  border-radius:var(--r-md);padding:14px 14px 14px 14px;margin-bottom:8px}
.box .em{width:52px;height:52px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:28px;line-height:1;flex:none;
  background:color-mix(in srgb,var(--c) var(--tint),var(--surface))}
.box .body{flex:1;min-width:0}
.box .when{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);font-weight:550}
.box .when::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.box .nm{display:block;font-weight:650;font-size:17px;line-height:1.25;margin-top:2px}
.box .meta{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.box.eaten .em,.box.eaten .body{opacity:.45}
.box.eaten .nm{text-decoration:line-through}
.tick{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line2);display:grid;place-items:center;flex:none}
.tick svg{opacity:0}
.tick.on{background:var(--c);box-shadow:none}
.tick.on svg{opacity:1}
@media (prefers-reduced-motion:no-preference){.tick.on{animation:pop .25s ease-out}}
@keyframes pop{50%{transform:scale(1.12)}}
.rate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 12px 4px;font-size:15px}
.rate button,.seg button{border-radius:10px;padding:8px 13px;font-weight:600;background:var(--surface);font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line2)}
.rate button.on,.seg button.on{background:var(--btn);color:var(--btn-ink);box-shadow:none}

/* týden */
.fridge{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.fridge .hd{font-size:13px;color:var(--muted);font-weight:550;padding:0 2px 2px}
.fridge .day{display:flex;flex-direction:column;justify-content:center}
.fridge .day b{font-size:18px;font-weight:750;line-height:1}
.fridge .day span{font-size:12px;color:var(--muted);margin-top:4px}
.fridge .day span.off{color:var(--warn);font-weight:650}
.cell{--c:var(--seda);position:relative;min-height:70px;border-radius:var(--r-sm);background:var(--surface);
  padding:8px;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:inset 3px 0 0 var(--c)}
.cell .em{font-size:20px;line-height:1}
.cell .cn{font-size:12.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--muted);justify-content:center;align-items:center;font-size:22px}
.cell .flag{position:absolute;top:6px;right:7px;font-size:12px;font-weight:800;color:var(--warn)}
.today-row .day b{color:var(--obed)}

/* vaření */
.cook{background:var(--surface);border-radius:var(--r-md);padding:16px;margin-bottom:10px}
.cook.now{background:var(--btn);color:var(--btn-ink)}
.cook.now .muted{color:color-mix(in srgb,var(--btn-ink) 70%,transparent)}
.cook.now .boxes i{background:color-mix(in srgb,var(--btn-ink) 14%,transparent);color:var(--btn-ink)}
.cook-dish{display:flex;gap:12px;align-items:flex-start;padding:14px 0 0;width:100%}
.lid{--c:var(--seda);width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.boxes{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.boxes i{font-style:normal;font-size:12.5px;font-weight:600;border-radius:7px;padding:3px 8px;background:var(--bg);color:var(--ink)}
.boxes i.fz::after{content:" ❄"}
.boxes i.bad{box-shadow:inset 0 0 0 1.5px var(--warn)}
.note{font-size:14.5px;margin:12px 0 0;color:inherit;opacity:.85}

/* plánování */
.progress{display:flex;gap:5px;margin:4px 0 8px}
.progress i{height:5px;flex:1;border-radius:3px;background:var(--line2)}
.progress i.on{background:var(--ink)}
.seg{display:flex;gap:8px;margin:0 0 18px}
.opt{--c:var(--line2);display:flex;align-items:center;gap:14px;width:100%;padding:12px;margin-bottom:8px;background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{box-shadow:inset 0 0 0 2px var(--c)}
.opt .sw{order:3;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line2);flex:none;display:grid;place-items:center}
.opt.on .sw{background:var(--c);box-shadow:none}
.opt.on .sw::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translate(0,-1px) rotate(-45deg)}
.opt .em{width:48px;height:48px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:26px;flex:none;background:var(--bg)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;line-height:1.25;font-weight:650}
.opt .t span{font-size:14px;color:var(--muted)}
.warn{color:var(--warn);font-weight:650}
.tpl{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:8px;background:var(--surface);border-radius:var(--r-md);width:100%}

/* nákup */
.shop h3{margin:28px 0 6px;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.shop>.small{margin:-2px 0 8px!important}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:13px 2px;border-bottom:1px solid var(--line)}
.item .sq{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line2);flex:none;display:grid;place-items:center}
.item .sq svg{opacity:0}
.item.on .sq{background:var(--ink);box-shadow:none}
.item.on .sq svg{opacity:1}
.item .nm{flex:1;min-width:0;font-weight:550}
.item .nm small{display:block;font-weight:550;font-size:13px;color:var(--warn)}
.item .amt{color:var(--muted);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.item.on .nm,.item.on .amt{color:var(--muted);text-decoration:line-through}
.count{margin:0;font-size:22px;font-weight:750;letter-spacing:-.015em}

/* recepty */
.rec{display:flex;align-items:center;gap:14px;width:100%;padding:12px;margin-bottom:8px;background:var(--surface);border-radius:var(--r-md)}
.rec .em{width:48px;height:48px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:26px;flex:none;background:var(--bg)}
.rec .t{flex:1;min-width:0}
.rec .t b{display:block;line-height:1.25;font-weight:650}
.rec .t span{font-size:14px;color:var(--muted)}

/* panel */
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(12,20,16,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 40px);overflow:auto;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:0 16px calc(28px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.sheet.open .panel{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet .lidbar{width:40px;height:5px;margin:10px auto 22px;background:var(--line2);border-radius:3px}
.sheet .x{position:absolute;right:12px;top:22px;width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:17px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0}
.facts div{background:var(--surface);border-radius:var(--r-sm);padding:12px 6px;text-align:center}
.facts b{display:block;font-size:22px;font-weight:750;line-height:1.1;letter-spacing:-.015em}
.facts span{font-size:12.5px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-sm);padding:3px}
.stepper button{width:38px;height:38px;border-radius:9px;font-size:22px;font-weight:600;text-align:center}
ul.ing{list-style:none;padding:0;margin:6px 0}
ul.ing li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.ing li>span:last-child{font-variant-numeric:tabular-nums;text-align:right}
ol.how{padding-left:22px;margin:8px 0}
ol.how li{margin:0 0 10px;padding-left:4px}

/* lišta */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);z-index:5;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
.toast{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;bottom:calc(96px + env(safe-area-inset-bottom));background:var(--btn);color:var(--btn-ink);
  padding:13px 16px;border-radius:var(--r-sm);font-weight:600;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.empty{padding:20px 0}
.empty p{color:var(--muted);margin:8px 0 18px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.fld input{width:120px;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:0;box-shadow:inset 0 0 0 1.5px var(--line2);background:var(--surface);color:var(--ink);text-align:right}
.callout{background:var(--surface);border-radius:var(--r-md);padding:18px 16px 16px;margin-top:26px}
.callout h2{margin:0 0 6px;font-size:20px}
.callout p{color:var(--muted);margin:0 0 16px}

/* Lehký den: mobilní i široké rozložení */
:root{--bg:#F8F6FB;--surface:#FFFFFF;--ink:#29213D;--muted:#71667F;--line:#E8E1EF;--line2:#CFC3DF;--btn:#7961AD;--btn-ink:#FFFFFF;--note:#E9E0F5;--note-ink:#392A50;--r-lg:28px;--r-md:22px;--r-sm:15px;--font:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191520;--surface:#241F2E;--ink:#F1EBFA;--muted:#B7ABC7;--line:#393044;--line2:#594B6B;--btn:#B49ADD;--btn-ink:#21172F;--note:#392D4D;--note-ink:#EFE4FF}}
:root[data-theme="dark"]{--bg:#191520;--surface:#241F2E;--ink:#F1EBFA;--muted:#B7ABC7;--line:#393044;--line2:#594B6B;--btn:#B49ADD;--btn-ink:#21172F;--note:#392D4D;--note-ink:#EFE4FF}
h1,.hello h1{font-size:36px;letter-spacing:0;line-height:1.12}
.listek{padding:24px}.listek .motto{font-size:22px;letter-spacing:-.025em}.listek .od{font-size:12px}
.box{padding:20px 16px;margin-bottom:12px}.box .nm{font-size:18px}.btn{border-radius:24px}.seg button{border-radius:14px}
nav.tabs button.on{color:var(--btn)}
@media(min-width:800px){
 body{padding:100px 0 40px}
 .wrap{max-width:1200px;padding:28px 40px 48px}
 nav.tabs{top:0;bottom:auto;padding:14px 32px;border-top:0;border-bottom:1px solid var(--line)}
 nav.tabs .in{max-width:1120px;gap:12px}
 nav.tabs button{flex-direction:row;justify-content:center;gap:10px;font-size:16px;padding:12px;border-radius:16px}
 nav.tabs button.on{background:var(--note)}
 h1,.hello h1{font-size:48px}
 .view-dnes,.view-recepty{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 22px;align-items:start}
 .view-dnes>*,.view-recepty>*{grid-column:1/-1;min-width:0}
 .view-dnes>.box,.view-recepty>.rec{grid-column:auto;margin:0;height:100%;align-items:flex-start}
 .view-dnes>.hello{grid-column:1/3}.view-dnes>.listek{grid-column:3;grid-row:1/3;margin:0}
 .view-dnes>.box{flex-wrap:wrap;min-height:190px}.view-dnes>.box .body{flex-basis:calc(100% - 70px)}
 .view-dnes>.top-sum{max-width:100%}
 .fridge{grid-template-columns:100px repeat(3,minmax(0,1fr));gap:12px}
 .cell{min-height:125px;padding:18px;gap:10px}.cell .cn{font-size:17px;-webkit-line-clamp:3}.cell .em{font-size:26px}
 .view-tyden>[role=list]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.opt{height:100%;margin:0}
 .shop{columns:2;column-gap:48px}.shop-group{break-inside:avoid;padding:1px 0 12px}
 .pair{max-width:600px;margin-left:auto}.callout{padding:26px}.rec{padding:22px;min-height:130px}
 .sheet .panel{top:50%;bottom:auto;transform:translateY(-50%);max-width:760px;max-height:85%;border-radius:28px;padding:0 32px 32px}
 .toast{bottom:24px}
}
@media(min-width:800px) and (prefers-reduced-motion:no-preference){.sheet.open .panel{animation:none}}
@media(min-width:800px) and (max-width:1040px){.view-dnes,.view-recepty{grid-template-columns:repeat(2,minmax(0,1fr))}.view-dnes>.hello{grid-column:1}.view-dnes>.listek{grid-column:2}.view-dnes>.box{grid-column:auto}}


/* Úvod odpovídá schválenému směru E; stejné komponenty na mobilu i počítači. */
.view-dnes{display:block;max-width:1120px}
.home-heading{display:flex;justify-content:space-between;align-items:flex-start;margin:12px 0 28px}
.home-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:650;margin:0;color:var(--muted)}
.home-heading h1{font-size:clamp(28px,3.5vw,42px);line-height:1.18;letter-spacing:-.015em;margin:16px 0 14px;font-weight:650}
.home-sub{font-size:15px;color:var(--muted);margin:0;line-height:1.6}
.home-mark{font-size:36px;color:var(--btn);line-height:1;margin-top:8px}
.home-layout{display:grid;gap:28px}.home-menu,.home-aside{min-width:0}
.home-days{display:flex;gap:9px;margin:0 0 24px}.home-day{border-radius:16px;min-width:62px;min-height:70px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;background:var(--note);color:var(--note-ink)}
.home-day span{font-size:12px}.home-day b{font-size:19px;font-weight:650}.home-day.on{background:var(--btn);color:var(--btn-ink)}
.home-day-heading{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}.home-day-heading h2{font-size:18px;margin:0}.home-day-heading>span{color:var(--muted);font-size:13px}
.home-meals{display:grid;gap:12px}.home-meal{background:var(--surface);border-radius:22px;padding:22px;min-width:0}
.home-meal.featured{background:var(--note);color:var(--note-ink)}
.home-meal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.home-number{font-size:11px;color:var(--muted);letter-spacing:.06em}
.home-recipe{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;padding:14px 0 18px}
.home-recipe h3{font-size:18px;font-weight:500;letter-spacing:0;line-height:1.45;max-width:34ch}
.home-meal.featured h3{font-size:18px;max-width:34ch}.home-recipe-arrow{font-size:22px;flex:none;color:var(--btn)}

  let o = `<header class="home-heading"><div><p class="home-eyebrow">Ahoj${stav.profil?.jmeno ? ', ' + esc(stav.profil.jmeno) : ''}</p><h1>Tvůj jídelníček</h1><p class="home-sub">${planned ? 'Tvůj jídelníček na ' + rozsah(k) : 'Návrh jídelníčku na ' + rozsah(k)}</p></div></header>`;
  o += vyberTydne(k);
  const day = rozpis(t)[d], z = denZiviny(day);
  o += `<div class="home-controls"><div class="home-days" aria-label="Vybrat den">${days.map(n => `<button class="home-day ${d === n ? 'on' : ''}" aria-pressed="${d === n}" data-a="home-den:${n}"><span>${DNY_KR[n]}</span><b>${datumDne(k, n).getDate()}</b></button>`).join('')}</div><div class="home-day-heading"><h2>${current ? 'Dnes' : DNY[d]}</h2><span>${kr(date)}</span></div></div><div class="home-layout"><section class="home-menu" aria-label="Jídelníček"><div class="home-meals">`;
  SLOTY.forEach((slot, i) => {
    const x = day[slot];
    if (!x) { o += `<div class="home-meal"><span class="home-eyebrow">${SLOT_N[slot]}</span><p>Jídlo zatím není vybrané.</p><button class="link" data-a="planovat:${k}">Doplnit jídelníček</button></div>`; return; }
    const rc = R[x.id], values = zivinyJidla(x), eaten = !!t.snedeno[d + '-' + slot];
    o += `<article class="home-meal ${i === 0 ? 'featured' : ''} ${eaten ? 'eaten' : ''}"><div class="home-meal-top"><span class="home-eyebrow">${SLOT_N[slot]}</span><span class="home-number">0${i + 1} / 03</span></div><button class="home-recipe" data-a="recept:${rc.id}:1:${d}-${slot}:${k}"><h3>${esc(rc.nazev)}</h3><span class="home-recipe-arrow" aria-hidden="true">↗</span></button>${x.extraG ? `<p class="protein-badge">${popisNavyseni(x.id, x.extraG)}</p>` : ''}<div class="home-meal-bottom"><div class="home-pills"><span>${cislo(values[0])} kcal</span><span>${rc.cas} min</span></div>${current ? `<button class="home-eaten ${eaten ? 'on' : ''}" aria-pressed="${eaten}" data-a="snedeno:${d}-${slot}">${eaten ? '✓ Snědeno' : 'Označit snědené'}</button>` : `<span class="home-protein">${cislo(values[1])} g bílkovin</span>`}</div></article>`;
  });
  o += `</div><button class="btn home-plan-button" data-a="${planned ? 'planovat:' + k : 'home-pouzit'}">${planned ? 'Můj plán na celý týden' : 'Použít tento jídelníček'} <span aria-hidden="true">↗</span></button></section><aside class="home-aside"><section class="home-nutrition"><div class="home-aside-title"><h2>Souhrn dne</h2><button class="home-settings" data-a="cil" aria-label="Upravit nastavení">Nastavení</button></div><div class="home-calories"><strong>${cislo(z[0])}</strong><span>z ${cislo(cil().kcal)} kcal</span></div><div class="home-calorie-bar"><i style="width:${Math.min(100, z[0] / cil().kcal * 100)}%"></i></div><p class="tiny muted">Naplánovaná jídla · ${DNY[d].toLowerCase()}</p><div class="home-macros">${[['Bílkoviny', z[1], cil().b], ['Sacharidy', z[2], cil().s], ['Tuky', z[3], cil().t]].map(([name, value, target]) => `<div><span>${name}</span><b>${cislo(value)} <small>/ ${target} g</small></b></div>`).join('')}<div><span>Vláknina</span><b>${popisVlakniny(z[4], vlakninaDne(day), cil().vl)}</b></div></div>${!vlakninaDne(day) ? '<p class="tiny muted">≥ znamená nejméně známé množství. U některých surovin údaj chybí.</p>' : ''}<div class="protein-actions"><button class="btn line" data-a="protein:${d}">Doplnit bílkoviny</button>${SLOTY.some(slot => day[slot]?.extraG) ? `<button class="link small" data-a="protein-zrusit:${d}">Zrušit navýšení tohoto dne</button>` : ''}</div></section><section class="home-shortcuts"><button data-a="home-nakup"><span><b>Nákupní seznam</b><small>Suroviny na celý týden</small></span><span aria-hidden="true">↗</span></button><button data-a="${planned ? 'planovat:' + k : 'home-pouzit-nakup'}"><span><b>${planned ? 'Upravit jídelníček' : 'Použít návrh a nakoupit'}</b><small>${planned ? 'Vyměnit jídla v plánu' : 'Uložit plán a otevřít seznam'}</small></span><span aria-hidden="true">↗</span></button></section></aside></div>`;
  return o;
}

function kartaVareni(k, b, dnes) {
  const t = stav.tydny[k]; const v = NASTAVENI.vareni[b]; const bal = dnyBaleni(t)[b]; const m = barvy(t);
  if (!bal.length) return '';
  const cas = bal.reduce((a, x) => a + R[x.id].cas, 0);
  const kus = n => n === 1 ? 'kousek' : n < 5 ? 'kousky' : 'kousků';
  let o = `<section class="cook ${dnes ? 'now' : ''}"><h3>${dnes ? 'Dnes večer vaříš' : v.nazev + ' ' + kr(datumDne(k, v.denVareni))}</h3>
    <div class="small muted">Asi ${cas} minut${bal.length > 1 ? ', obě jídla se dají dělat souběžně' : ''}</div>`;
  bal.forEach(x => {
    const rc = R[x.id];
    o += `<button class="cook-dish" data-a="recept:${rc.id}:${x.porce}"><span class="lid" style="--c:${barva(x.id, m)}"></span>
      <span style="flex:1;min-width:0"><b>${esc(rc.nazev)}</b><br><span class="small muted">${x.celek ? `celý koláč, ${x.porce} ${kus(x.porce)}` : `${x.porce} ${x.porce < 5 ? 'krabičky' : 'krabiček'}`}, ${rc.cas} min</span>
      <span class="boxes">${x.kde.map(z => `<i style="--c:${barva(x.id, m)}" class="${z.st === 'mraz' ? 'fz' : z.st === 'nevydrzi' ? 'bad' : ''}">${DNY_KR[z.d]} ${z.s === 'obed' ? 'oběd' : 'večeře'}</i>`).join('')}</span></span></button>`;
  });
  bal.filter(x => x.celek && x.kde.length < x.porce).forEach(x => { o += `<p class="note">Z koláče sníš tento týden ${x.kde.length} ${x.kde.length < 5 ? 'kousky' : 'kousků'}. Zbytek hned zamraz a příští týden ho nepeč, stačí vytáhnout z mrazáku a koláčové suroviny v nákupu odškrtnout.</p>`; });
  if (bal.some(x => !x.celek)) o += `<p class="note">Uvařený hrnec zvaž a vyděl počtem krabiček, ať je v každé stejně.</p>`;
  bal.filter(x => R[x.id].lednice == null).forEach(x => { o += `<p class="note">${esc(kratce(x.id))}: autorka dobu skladování neupřesňuje.</p>`; });
  if (bal.some(x => x.kde.some(z => z.st === 'mraz'))) o += `<p class="note">Krabičky a kousky s ❄ dej hned po uvaření do mrazáku a večer předem je přendej do lednice.</p>`;
  bal.filter(x => x.kde.some(z => z.st === 'nevydrzi')).forEach(x => {
    o += `<p class="note"><span class="warn">${esc(kratce(x.id))} vydrží jen ${R[x.id].lednice} dny a zamrazit nejde.</span> Na orámované dny si v plánu dej jiné jídlo.</p>`;
  });
  return o + `</section>`;
}

function vTyden() {
  const k = ui.tyden, t = tyden(k);
  if (t.hotovo) ui.krok = PREHLED;
  const kroky = PREHLED + 1;
  let o = `<header class="top"><h1>Týden ${rozsah(k)}</h1></header>` + vyberTydne(k);
  if (!t.hotovo) o += `<div class="progress" aria-label="Krok ${ui.krok + 1} z ${kroky}">${Array.from({ length: kroky }, (_, i) => `<i class="${i <= ui.krok ? 'on' : ''}"></i>`).join('')}</div>`;

  if (ui.krok === 0) {
    o += `<h2 style="margin-top:14px">Co budeš snídat?</h2><p class="small muted">Vyber jednu nebo dvě snídaně. Budou se střídat den po dni.</p>`;
    if (stav.sablony.length) {
      o += `<h3 style="margin:20px 0 4px">Osvědčené týdny</h3>` + stav.sablony.map((s, i) =>
        `<button class="tpl" data-a="sablona:${i}"><span style="flex:1"><b>${esc(s.nazev)}</b><br><span class="small muted">${s.vareni.flat().map(id => R[id] ? esc(kratce(id)) : '').join(', ')}</span></span><span class="link">Použít</span></button>`).join('')
        + `<h3 style="margin:22px 0 4px">Nebo vyber znovu</h3>`;
    }
    o += vyber(['snidane'], t.snidane, 'pick:s', t);
    o += navigace(t.snidane.length > 0, 'Vyber aspoň jednu snídani');
  } else if (ui.krok === 1) {
    const sl = t.vecere.filter(id => R[id].chut === 'sladka').length, sa = t.vecere.length - sl;
    o += `<h2 style="margin-top:14px">Co budeš večeřet?</h2><p class="small muted">Vyber sladkou a slanou večeři. Budou se střídat den po dni v pořadí, jak je vybereš.</p>`;
    if (t.vecere.length && (!sl || !sa)) o += `<p class="small warn">Přidej ještě ${sl ? 'slanou' : 'sladkou'}, ať se střídají.</p>`;
    o += vyber(['vecere'], t.vecere, 'pick:e', t);
    o += navigace(t.vecere.length > 0, 'Vyber aspoň jednu večeři');
  } else if (ui.krok < PREHLED) {
    const b = ui.krok - 2, v = NASTAVENI.vareni[b], j = t.vareni[b];
    o += `<h2 style="margin-top:14px">Co budeš obědvat?</h2>
      <p class="small muted">Obědy si uvaříš do krabiček ${v.nazev.toLowerCase().replace('neděle', 'v neděli').replace('čtvrtek', 've čtvrtek')} ${kr(datumDne(k, v.denVareni))} na ${v.dny.map(d => DNY_KDY[d]).join(', ').replace(/, ([^,]*)$/, ' a $1')}. Vyber jedno jídlo, nebo dvě, která se budou střídat den po dni.</p>`;
    o += vyber(['hlavni'], j, 'pick:v' + b, t, v.dny[v.dny.length - 1] - v.denVareni, b > 0 ? t.vareni.slice(0, b).flat() : []);
    o += navigace(j.length > 0, 'Vyber aspoň jedno jídlo');
  } else {
    o += vPrehled(k, t);
  }
  return o;
}

function vyber(typy, vybrane, akce, t, pocetDni = 0, uzVybrane = []) {
  const m = barvy(t);
  const list = RECEPTY.filter(r => typy.includes(r.typ)).sort((a, b) => hodn(b.id) - hodn(a.id));
  return `<div role="list">${list.map(r => {
    const z = ziviny(r.id), on = vybrane.includes(r.id);
    const kratka = r.typ === 'hlavni' && r.lednice != null && !r.mrazak && r.lednice < pocetDni;
    return `<button class="opt ${on ? 'on' : ''}" role="listitem" aria-pressed="${on}" style="--c:${on ? barva(r.id, m) : 'var(--line)'}" data-a="${akce}:${r.id}">
      <span class="sw"></span>
      <span class="t"><b>${esc(r.nazev)}${hodn(r.id) > 0 ? ' ♥' : ''}</b><span>${r.chut ? CHUT_N[r.chut] + ', ' : ''}${r.cas} min, ${cislo(z[0])} kcal, ${cislo(z[1])} g bílkovin${kratka ? `, <span class="warn">vydrží jen ${r.lednice} dny</span>` : ''}${r.lednice == null ? ', skladování neupřesněno' : ''}${uzVybrane.includes(r.id) ? ', už máš v neděli' : ''}</span></span></button>`;
  }).join('')}</div>`;
}

function navigace(muzeDal, hlaska) {
  return `<div class="pair">${ui.krok > 0 ? `<button class="btn line" data-a="krok:${ui.krok - 1}">Zpět</button>` : ''}
    <button class="btn" ${muzeDal ? '' : 'disabled'} data-a="krok:${ui.krok + 1}">${muzeDal ? 'Pokračovat' : hlaska}</button></div>`;
}

function vPrehled(k, t) {
  const r = rozpis(t), m = barvy(t);
  let o = t.hotovo ? '' : `<h2 style="margin-top:14px">Takhle vypadá tvůj týden</h2><p class="small muted">Klepnutím na krabičku jídlo vyměníš.</p>`;
  o += `<div class="week-days">`;
  NASTAVENI.planDny.forEach(d => {
    const den = r[d], z = denZiviny(den), dnes = k === TENTO && d === DEN;
    o += `<section class="week-day ${dnes ? 'is-today' : ''}"><header class="week-day-title"><h2>${DNY[d]}</h2><span>${kr(datumDne(k, d))}</span></header><div class="week-meals">`;
    SLOTY.forEach(slot => {
      const x = den[slot];
      if (!x) { o += `<button class="week-meal empty" data-a="slot:${d}-${slot}"><span class="home-eyebrow">${SLOT_N[slot]}</span><span>Vybrat jídlo +</span></button>`; return; }
      const st = stavKrabicky(x), rc = R[x.id];
      o += `<button class="week-meal ${slot === 'snidane' ? 'featured' : ''}" data-a="slot:${d}-${slot}" aria-label="${DNY[d]}, ${SLOT_N[slot]}: ${esc(rc.nazev)}"><span class="home-eyebrow">${SLOT_N[slot]}</span><span class="week-name">${esc(rc.nazev)}</span><span class="week-meta">${cislo(zivinyJidla(x)[0])} kcal · ${rc.cas} min</span>${x.extraG ? '<span class="protein-badge">Navýšené bílkoviny</span>' : ''}${st === 'neovereno' ? '<span class="tiny muted">Skladování neupřesněno</span>' : st === 'mraz' ? '<span class="week-storage">Z mrazáku</span>' : st === 'nevydrzi' ? '<span class="warn tiny">Vyber čerstvější jídlo</span>' : ''}</button>`;
    });
    o += `</div><p class="week-total">Celkem <b>${cislo(z[0])} kcal</b></p></section>`;
  });
  o += `</div>`;

  const pd = NASTAVENI.planDny;
  const prumer = pd.map(d => denZiviny(r[d])).reduce((a, z) => a.map((v, i) => v + z[i] / pd.length), [0, 0, 0, 0, 0]);
  o += `<h3 style="margin:24px 0 0">Průměrný den</h3><div class="sum">${soucet(prumer, null, pd.every(d => vlakninaDne(r[d])))}</div>`;

  const extraMeals = pd.flatMap(d => SLOTY.filter(slot => r[d][slot]?.extraG).map(slot => `<li>${DNY[d]}, ${SLOT_N[slot].toLowerCase()}: ${popisNavyseni(r[d][slot].id, r[d][slot].extraG)}</li>`));
  if (extraMeals.length) o += `<section class="protein-offer"><h3>Navýšení na jednotlivé dny</h3><ul>${extraMeals.join('')}</ul></section>`;
  o += `<h2>Kdy vaříš</h2>`;
  NASTAVENI.vareni.forEach((_, b) => { o += kartaVareni(k, b, false); });

  if (!t.hotovo) o += `<div class="pair"><button class="btn line" data-a="krok:${ui.krok - 1}">Zpět</button><button class="btn" data-a="hotovo">Hotovo, jdu nakoupit</button></div>`;
  else o += `<div style="display:grid;gap:10px;margin-top:18px"><button class="btn" data-a="tab:nakup">Nákupní seznam</button>
    <button class="btn line" data-a="ulozit-sablonu">Uložit jako osvědčený týden</button>
    <button class="btn line" data-a="upravit">Naplánovat znovu</button></div>`;
  return o;
}

function vNakup() {
  const k = ui.tyden, t = zobrazenyTyden(k);
  let o = `<header class="top"><h1>Nákup</h1><p class="sub">na týden ${rozsah(k)}</p></header>` + vyberTydne(k);
  if (!maPlan(k)) o += `<p class="shopping-proposal">Suroviny k návrhu jídelníčku na úvodu. <button class="link" data-a="planovat:${k}">Vybrat jiná jídla</button></p>`;
  const sk = nakup(t);
  const vse = sk.flatMap(g => g.polozky).filter(p => !S[p.k].doma && !S[p.k].zasoba);
  const zbyva = vse.filter(p => !t.nakup[p.k]).length;
  o += `<p class="count">${zbyva ? `Zbývá ${zbyva} z ${vse.length}` : 'Máš všechno'}</p><p class="small muted" style="margin-top:2px">Odškrtni i to, co už máš doma.</p><div class="shop"><div class="shop-main">`;
  const jeZasoba = g => g.o === ZASOBY || g.o === 'Koření a doma';
  let zasobyZacaly = false;
  [...sk.filter(g => !jeZasoba(g)), ...sk.filter(jeZasoba)].forEach(g => {
    if (jeZasoba(g) && !zasobyZacaly) { o += `</div><div class="shop-stocks">`; zasobyZacaly = true; }
    const pol = g.polozky.slice().sort((a, b) => (t.nakup[a.k] ? 1 : 0) - (t.nakup[b.k] ? 1 : 0));
    o += `<section class="shop-group ${g.o === ZASOBY || g.o === 'Koření a doma' ? 'stock' : ''}"><h3>${g.o}</h3>` + (g.o === ZASOBY ? `<p class="small muted" style="margin:-4px 0 6px">Vydrží dlouho, většinou je máš. Mrkni, jestli máš aspoň tolik, a kup jen to, co dochází.</p>` : '');
    pol.forEach(p => {
      const on = t.nakup[p.k]; const s = S[p.k];
      const pozdeji = s.o === 'Maso a ryby' && p.pozdejiG > 0
        ? `<small>${p.pozdejiG >= p.g - 1 ? `Na ${DRUHE_VARENI}: kup až ve ${DRUHE_VARENI}, nebo hned zamraz` : `Z toho ${mnozstvi(p.k, p.pozdejiG)} na ${DRUHE_VARENI}, ty zamraz`}</small>` : '';
      o += `<button class="item ${on ? 'on' : ''}" aria-pressed="${!!on}" data-a="koupeno:${p.k}"><span class="sq">${IKONA_OK.replace('#fff', 'var(--bg)')}</span>
        <span class="nm">${esc(s.n)}${pozdeji}</span><span class="amt">${mnozstvi(p.k, p.g)}</span></button>`;
    });
    o += `</section>`;
  });
  o += `</div></div><div style="margin-top:22px"><button class="btn line" data-a="sdilet">Poslat seznam do Poznámek</button></div>`;
  return o;
}

// Fotografie jsou nepovinné; přednost má lokální soubor ve fotky/.
function bezpecnyOdkaz(url) {
  if (typeof url !== 'string') return '';
  return /^https?:\/\//i.test(url) || /^fotky\/[a-zA-Z0-9_./-]+$/.test(url) && !url.includes('..') ? url : '';
}
function lokalniFotka(url) { return typeof url === 'string' && /^fotky\/[a-zA-Z0-9_-]+\.(jpe?g|png|webp)$/i.test(url) ? url : ''; }
function fotkaReceptu(r, detail = false) {
  const src = lokalniFotka(r.foto);
  if (!src) return '';
  return `<img class="recipe-photo ${detail ? 'detail-photo' : ''}" src="${esc(src)}" alt="${esc(r.nazev)}" loading="lazy" decoding="async" onerror="this.closest('.has-photo')?.classList.remove('has-photo');this.remove()">`;
}

function vRecepty() {
  const f = ['snidane', 'hlavni', 'vecere'].includes(ui.filtr) ? ui.filtr : 'snidane';
  let o = `<header class="top"><h1>Recepty</h1><p class="sub">Recepty pro tvůj jídelníček.</p></header>
    <div class="seg" style="flex-wrap:wrap">${['snidane', 'hlavni', 'vecere'].map(x => `<button class="${f === x ? 'on' : ''}" data-a="filtr:${x}">${x === 'vse' ? 'Vše' : TYP_N[x]}</button>`).join('')}</div>`;
  ['snidane', 'hlavni', 'vecere'].filter(x => f === x).forEach(typ => {
    o += `<h2>${TYP_N[typ]}</h2>`;
    if (typ === 'zachranne') o += `<p class="small muted" style="margin-top:-6px">Ze zásob za deset minut, na dny, kdy plán nevyjde.</p>`;
    RECEPTY.filter(r => r.typ === typ).sort((a, b) => hodn(b.id) - hodn(a.id)).forEach(r => {
      const z = ziviny(r.id);
      o += `<button class="rec ${lokalniFotka(r.foto) ? 'has-photo' : ''}" data-a="recept:${r.id}">${fotkaReceptu(r)}<span class="t"><b>${esc(r.nazev)}${hodn(r.id) > 0 ? ' ♥' : ''}</b>
        <span>${r.chut ? CHUT_N[r.chut] + ', ' : ''}${r.cas} min, ${cislo(z[0])} kcal, ${cislo(z[1])} g bílkovin, ${popisVlakniny(z[4], uplnaVlaknina(r.id))} vlákniny${r.odhady?.length ? ' · Část gramáží odhadem' : ''}</span></span></button>`;
    });
  });
  return o;
}

/* --- panely --- */
function vRecept(id, porce, context = null) {
  const x = kontextJidla(context, id), extra = x?.extraG || 0;
  const r = R[id], z = x ? zivinyJidla(x) : ziviny(id), f = porce / r.porce;
  const forma = porce === 1 ? 'porce' : porce < 5 ? 'porce' : 'porcí';
  return `<article class="recipe-page"><button class="recipe-back" data-a="recept-zpet">← Zpět</button><header class="recipe-heading"><p class="home-eyebrow">${TYP_N[r.typ]}</p><h1>${esc(r.nazev)}</h1>${bezpecnyOdkaz(r.zdroj) && /^https?:/.test(r.zdroj) ? `<p class="tiny"><a class="link" href="${esc(r.zdroj)}" target="_blank" rel="noopener noreferrer">Původní recept${r.autor ? ' · ' + esc(r.autor) : ''}</a></p>` : ''}
    <p class="small muted" style="margin:0">${r.cas} minut${r.lednice == null ? ', skladování neupřesněno' : r.typ !== 'snidane' ? `, v lednici vydrží ${r.lednice} ${r.lednice === 1 ? 'den' : 'dny'}${r.mrazak ? ', jde zamrazit' : ''}` : ''}</p></header>
    ${extra ? `<p class="protein-offer">Úprava pro ${DNY[+context.kk.split('-')[0]].toLowerCase()} ${kr(datumDne(context.k, +context.kk.split('-')[0]))}: ${popisNavyseni(id, extra)}. Ostatní dny se řídí vlastním plánem.</p>` : ''}${fotkaReceptu(r, true)}<div class="recipe-facts"><div class="facts"><div><b>${cislo(z[0])}</b><span>kcal</span></div><div><b>${cislo(z[1])}</b><span>bílkoviny</span></div><div><b>${cislo(z[2])}</b><span>sacharidy</span></div><div><b>${cislo(z[3])}</b><span>tuky</span></div><div><b>${uplnaVlaknina(id) ? '' : '≥ '}${cislo(z[4], 1)}</b><span>vláknina (g)</span></div></div>
    <p class="tiny muted" style="margin-top:-8px">Na jednu porci, přibližně spočítáno ze surovin.${!uplnaVlaknina(id) ? ' ≥ u vlákniny znamená nejméně známé množství; některé údaje chybí.' : ''}</p></div>
    ${r.poznamka ? `<p class="shopping-proposal">${esc(r.poznamka)}</p>` : ''}<div class="recipe-columns"><section class="recipe-ingredients"><div class="recipe-ingredients-heading"><h2>Suroviny</h2>
      <div class="stepper"><button data-a="porce:${id}:${Math.max(1, porce - 1)}" aria-label="Méně porcí">−</button><b>${porce} ${forma}</b><button data-a="porce:${id}:${porce + 1}" aria-label="Více porcí">+</button></div></div>
    <ul class="ing">${r.suroviny.map(([k, g, na, popis], i) => `<li><span>${esc(S[k].n)}${popis ? ' <span class="muted">(' + esc(popis) + ')</span>' : ''}${r.odhady?.includes(i) ? ' <span class="muted">(odhad)</span>' : ''}${na === 'porce' ? ' <span class="muted">(k jídlu)</span>' : ''}</span><span class="muted">${typeof g === 'number' ? cislo(Math.round((na === 'porce' ? g * porce : g * f) + (extra && k === BILKOVINY[id].s ? extra * porce : 0))) + ' g' : esc(g)}</span></li>`).join('')}</ul>
    </section><section class="recipe-instructions"><h2>Postup</h2><ol class="how">${r.postup.map(p => {
      if (extra && id === 'tousty') p = p.replace('2 vajíčka', 'vejce podle množství v seznamu surovin');
      if (extra && id === 'kolac') p = p.replace('150 g bílého skyru', `${150 + extra} g bílého skyru`);
      return `<li>${esc(p)}</li>`;
    }).join('')}${extra ? `<li>Použij navýšené množství ${esc(S[BILKOVINY[id].s].n.toLowerCase())} uvedené v seznamu surovin. Navýšení patří jen k vybranému dni.</li>` : ''}</ol>
    <div class="rate" style="margin:18px 0 0"><span class="muted" style="flex:1">Uvařit znovu?</span>
      <button class="${hodn(id) > 0 ? 'on' : ''}" data-a="hodnotit:${id}:1">Ano</button><button class="${hodn(id) < 0 ? 'on' : ''}" data-a="hodnotit:${id}:-1">Ne</button></div></section></div></article>`;
}
const LOKALNI_DATA = 'Jméno, cíle a plán se ukládají pouze v tomto prohlížeči. Nesynchronizují se. Smazání dat webu nebo nový telefon znamená ztrátu těchto údajů. Neukládáme je na server.';
function formularNastaveni() {
  const c = cil();
  const pole = [['kcal', 'Kalorie', 'kcal'], ['b', 'Bílkoviny', 'g'], ['s', 'Sacharidy', 'g'], ['t', 'Tuky', 'g']];
  return `<label class="fld"><span>Jak tě oslovovat (nepovinné)</span><input id="nast-jmeno" type="text" maxlength="60" autocomplete="off" value="${esc(stav.profil?.jmeno || '')}"></label>${pole.map(([k, n, j]) => `<label class="fld"><span>${n} <span class="muted">(${j} za den)</span></span><input id="cil-${k}" type="number" inputmode="numeric" min="1" step="1" value="${c[k] || ''}" required></label>`).join('')}<label class="fld"><span>Vláknina <span class="muted">(g za den, nepovinné)</span></span><input id="cil-vl" type="number" inputmode="decimal" min="0.1" step="0.1" value="${c.vl || ''}"></label><p class="small muted">Zadej vlastní denní cíle. Aplikace je sama neurčuje.</p><p class="local-data-note">${LOKALNI_DATA}</p><button class="btn" data-a="ulozit-cil">Uložit nastavení</button>`;
}
function vUvodniNastaveni() {
  return `<section class="onboarding"><header class="top"><h1>Vítej v Nachystáno</h1><p class="sub">Nejdřív si nastav oslovení a své denní cíle.</p></header>${Object.keys(stav.tydny || {}).length ? '<p class="shopping-proposal">Tvůj dosavadní plán zůstává uložený. Doplněním nastavení o něj nepřijdeš.</p>' : ''}${formularNastaveni()}</section>`;
}
function sheetCil() {
  return `<div class="lidbar"></div><button class="x" data-a="zavrit" aria-label="Zavřít">✕</button><h2>Nastavení</h2>${formularNastaveni()}`;
}
function sheetSlot(kk) {
  const [d, s] = kk.split('-'); const t = stav.tydny[ui.tyden]; const m = barvy(t);
  const x = rozpis(t)[+d][s];
  const typy = s === 'snidane' ? ['snidane', 'zachranne'] : s === 'vecere' ? ['vecere', 'zachranne'] : ['hlavni', 'zachranne'];
  let o = `<div class="lidbar" style="--c:${x ? barva(x.id, m) : 'var(--seda)'}"></div><button class="x" data-a="zavrit" aria-label="Zavřít">✕</button>
    <h2 style="margin:0 44px 4px 0">${DNY[d]}, ${SLOT_N[s].toLowerCase()}</h2>`;
  if (x) o += `<p class="small muted" style="margin:0 0 12px">Teď: ${esc(R[x.id].nazev)}. <button class="link" data-a="recept:${x.id}:1:${kk}:${ui.tyden}">Zobrazit recept</button></p>`;
  if (t.zmeny[kk]) o += `<button class="btn line" data-a="zmena-zpet:${kk}">Vrátit původní jídlo</button>`;
  typy.forEach(typ => {
    o += `<h3 style="margin:20px 0 2px">${typ === 'zachranne' ? 'Záchranná jídla' : 'Vyměnit za'}</h3>`;
    RECEPTY.filter(r => r.typ === typ).forEach(r => {
      o += `<button class="rec" data-a="zmena:${kk}:${r.id}"><span class="t"><b>${esc(r.nazev)}</b><span>${cislo(ziviny(r.id)[0])} kcal, ${r.cas} min</span></span></button>`;
    });
  });
  return o;
}

/* =====================================================================
   VYKRESLENÍ A AKCE
   ===================================================================== */
function adresaReceptu(id, porce, context = null) {
  return '#recept/' + encodeURIComponent(id) + '?porce=' + porce + (context ? '&tyden=' + encodeURIComponent(context.k) + '&jidlo=' + encodeURIComponent(context.kk) : '');
}
function receptZAdresy() {
  if (!location.hash.startsWith('#recept/')) return null;
  try {
    const [id, query = ''] = location.hash.slice(8).split('?');
    const params = new URLSearchParams(query), decoded = decodeURIComponent(id), n = Number(params.get('porce'));
    const context = params.has('tyden') && params.has('jidlo') ? { k: params.get('tyden'), kk: params.get('jidlo') } : null;
    return { id: decoded, context, porce: Number.isInteger(n) && n > 0 && n <= 1000 ? n : (Object.hasOwn(R, decoded) ? R[decoded].porce : 1) };
  } catch { return { id: '', porce: 1 }; }
}
function otevriRecept(id, porce, context = null) {
  if (!Object.hasOwn(R, id)) return;
  // Návrat obnoví původní záložku, filtr, týden, otevřený výběr i posun stránky.
  history.replaceState({ kajaUi: JSON.parse(JSON.stringify(ui)), scroll: scrollY }, '', location.href);
  ui.sheet = null;
  history.pushState({ recipeFromApp: true }, '', adresaReceptu(id, porce, context));
  nahoru();
}
function zpetZReceptu() {
  if (history.state?.recipeFromApp) { history.back(); return; }
  ui.tab = 'recepty'; ui.sheet = null;
  history.replaceState({ kajaUi: JSON.parse(JSON.stringify(ui)) }, '', location.pathname + location.search);
  render(); nahoru();
}
window.addEventListener('popstate', () => {
  if (history.state?.kajaUi) Object.assign(ui, history.state.kajaUi);
  render();
  if (!receptZAdresy() && history.state?.kajaUi) requestAnimationFrame(() => window.scrollTo(0, history.state.scroll || 0));
});
window.addEventListener('hashchange', render);
function vykresliTema() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const button = document.querySelector('[data-a="tema"]');
  button.setAttribute('aria-pressed', String(dark));
  button.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${dark ? '<path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>' : '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>'}</svg>`;
  button.title = dark ? 'Vypnout noční režim' : 'Zapnout noční režim';
  button.classList.toggle('on', dark);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#191520' : '#F8F6FB';
}
function render() {
  vykresliTema();
  if (!maNastaveni()) {
    $('#view').className = 'wrap view-nastaveni'; $('#view').innerHTML = vUvodniNastaveni();
    $('#sheet').classList.remove('open'); document.title = 'Nastavení | Nachystáno';
    document.querySelectorAll('nav.tabs [data-a^="tab:"]').forEach(b => { b.classList.remove('on'); b.removeAttribute('aria-current'); b.disabled = true; });
    if (ulozeniNefunguje) $('#view').insertAdjacentHTML('afterbegin', '<p class="shopping-proposal" role="alert">Prohlížeč nepovolil ukládání. Po zavření stránky můžeš o nastavení a plán přijít.</p>');
    return;
  }
  const recipe = receptZAdresy();
  $('#view').className = 'wrap view-' + (recipe ? 'recept' : ui.tab);
  $('#view').innerHTML = recipe ? (Object.hasOwn(R, recipe.id) ? vRecept(recipe.id, recipe.porce, recipe.context) : `<h1>Recept se nenašel</h1><p><button class="link" data-a="recept-zpet">Přejít na recepty</button></p>`) : { dnes: vDnes, tyden: vTyden, nakup: vNakup, recepty: vRecepty }[ui.tab]();
  document.title = recipe && Object.hasOwn(R, recipe.id) ? R[recipe.id].nazev + ' | Nachystáno' : 'Nachystáno';
  document.querySelectorAll('nav.tabs [data-a^="tab:"]').forEach(b => { const on = b.dataset.a === 'tab:' + (recipe ? 'recepty' : ui.tab); b.disabled = false; b.classList.toggle('on', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  if (ui.sheet && !recipe) { $('#panel').innerHTML = ui.sheet.typ === 'bilkoviny' ? panelBilkovin(ui.sheet.k, ui.sheet.d) : ui.sheet.typ === 'cil' ? sheetCil() : sheetSlot(ui.sheet.kk); $('#sheet').classList.add('open'); }
  else $('#sheet').classList.remove('open');
  if (ulozeniNefunguje) $('#view').insertAdjacentHTML('afterbegin', '<p class="shopping-proposal" role="alert">Prohlížeč nepovolil ukládání. Změny platí jen pro tuto otevřenou stránku.</p>');
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
function nahoru() { window.scrollTo({ top: 0 }); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const [a, ...p] = el.dataset.a.split(':');
  const t = () => tyden(ui.tyden);
  switch (a) {
    case 'protein': ui.bCil = null; ui.sheet = { typ: 'bilkoviny', k: ui.tyden, d: +p[0] }; break;
    case 'protein-prepocitat': {
      const n = Number($('#protein-target').value);
      if (!Number.isInteger(n) || n < 1 || n > 500) { toast('Zadej platný cíl v gramech.'); return; }
      ui.bCil = n; break;
    }
    case 'protein-pouzit': {
      const sheet = ui.sheet; if (sheet?.typ !== 'bilkoviny') return;
      const typed = Number($('#protein-target').value), target = ui.bCil || cil().b;
      if (typed !== target) { toast('Nejdřív přepočítej návrhy pro nový cíl.'); return; }
      const offer = navrhyBilkovin(sheet.k, sheet.d, target)[+p[0]]; if (!offer) return;
      stav.cil = { ...cil(), b: target };
      zapisNavyseni(sheet.k, offer.edits); ui.sheet = null;
      toast('Upraveno. V nákupu znovu zkontroluj navýšené suroviny.'); break;
    }
    case 'protein-zrusit': {
      const day = rozpis(zobrazenyTyden(ui.tyden))[+p[0]];
      zapisNavyseni(ui.tyden, SLOTY.filter(slot => day[slot]?.extraG).map(slot => ({ kk: p[0] + '-' + slot, id: day[slot].id, g: 0 })));
      toast('Navýšení tohoto dne je zrušené.'); break;
    }
    case 'tema': {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('kajin-tema', next); } catch {}
      vykresliTema(); return;
    }
    case 'tab': if (receptZAdresy()) history.pushState(null, '', location.pathname + location.search); ui.tab = p[0]; ui.sheet = null; if (p[0] === 'tyden' && !maPlan(ui.tyden) && ui.krok === PREHLED) ui.krok = 0; nahoru(); break;
    case 'home-den': ui.den = +p[0]; break;
    case 'home-pouzit':
    case 'home-pouzit-nakup':
      if (!maPlan(ui.tyden)) { stav.tydny[ui.tyden] = { ...navrhTydne(), hotovo: true }; uloz(); }
      if (a === 'home-pouzit-nakup') ui.tab = 'nakup';
      break;
    case 'home-nakup': ui.tab = 'nakup'; nahoru(); break;
    case 'tyden': ui.den = null; ui.tyden = p[0]; ui.krok = maPlan(p[0]) ? PREHLED : 0; break;
    case 'planovat': ui.tyden = p[0]; ui.tab = 'tyden'; ui.krok = maPlan(p[0]) ? PREHLED : 0; nahoru(); break;
    case 'pick': {
      const id = p[1], kam = p[0];
      const arr = kam === 's' ? t().snidane : kam === 'e' ? t().vecere : t().vareni[+kam.slice(1)];
      const max = kam === 's' ? NASTAVENI.maxSnidani : kam === 'e' ? NASTAVENI.maxVeceri : NASTAVENI.maxJidelNaVareni;
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else if (arr.length < max) arr.push(id); else { toast(`Můžeš vybrat nejvíc ${max}. Nejdřív jedno odeber.`); return; }
      t().zmeny = {}; t().navyseni = {}; uloz(); break;
    }
    case 'krok': ui.krok = +p[0]; nahoru(); break;
    case 'hotovo': t().hotovo = true; uloz(); ui.tab = 'nakup'; nahoru(); toast('Týden je naplánovaný. Teď nákup.'); break;
    case 'upravit': t().hotovo = false; ui.krok = 0; uloz(); nahoru(); break;
    case 'slot': ui.sheet = { typ: 'slot', kk: p[0] }; break;
    case 'zmena': if (t().navyseni) delete t().navyseni[p[0]]; t().zmeny[p[0]] = p[1]; uloz(); ui.sheet = null; break;
    case 'zmena-zpet': if (t().navyseni) delete t().navyseni[p[0]]; delete t().zmeny[p[0]]; uloz(); ui.sheet = null; break;
    case 'recept': otevriRecept(p[0], +(p[1] || R[p[0]]?.porce || 1), p[2] && p[3] ? { kk: p[2], k: p[3] } : null); break;
    case 'recept-zpet': zpetZReceptu(); return;
    case 'porce': if (R[p[0]]) history.replaceState(history.state, '', adresaReceptu(p[0], Math.min(1000, Math.max(1, +p[1] || 1)), receptZAdresy()?.context)); break;
    case 'zavrit': ui.sheet = null; break;
    case 'cil': ui.sheet = { typ: 'cil' }; break;
    case 'ulozit-cil': {
      const v = {}; let ok = true;
      ['kcal', 'b', 's', 't'].forEach(k => { const n = Number(document.getElementById('cil-' + k).value); if (!Number.isInteger(n) || n <= 0) ok = false; v[k] = n; });
      const fiberRaw = $('#cil-vl').value.trim();
      if (fiberRaw) { const n = Number(fiberRaw); if (!Number.isFinite(n) || n <= 0) { toast('Vlákninu nech prázdnou, nebo zadej kladné číslo.'); return; } else v.vl = n; }
      if (!ok) { toast('Vyplň všechny denní cíle kladnými celými čísly.'); return; }
      stav.cil = v; stav.profil = { jmeno: $('#nast-jmeno').value.trim().slice(0, 60), nastaveno: true };
      uloz(); ui.sheet = null; toast(ulozeniNefunguje ? 'Ukládání není dostupné. Nastavení platí jen do zavření stránky.' : 'Nastavení je uložené.'); break;
    }
    case 'snedeno': { const tt = tyden(TENTO); tt.snedeno[p[0]] = !tt.snedeno[p[0]]; uloz(); break; }
    case 'hodnotit': stav.hodnoceni[p[0]] = hodn(p[0]) === +p[1] ? 0 : +p[1]; uloz(); if (+p[1] > 0) toast('Uloženo, při plánování ho uvidíš nahoře.'); break;
    case 'koupeno': {
      let target;
      if (maPlan(ui.tyden)) target = t().nakup;
      else { stav.navrhy ||= {}; stav.navrhy[ui.tyden] ||= { nakup: {} }; target = stav.navrhy[ui.tyden].nakup; }
      target[p[0]] = !target[p[0]]; uloz(); break;
    }
    case 'filtr': ui.filtr = p[0]; break;
    case 'nakup-pristi': ui.tyden = PRISTI; ui.tab = 'nakup'; nahoru(); break;
    case 'zachrana': ui.tab = 'recepty'; ui.filtr = 'zachranne'; nahoru(); break;
    case 'ulozit-sablonu': {
      const tt = t();
      stav.sablony.unshift({ nazev: 'Týden ' + rozsah(ui.tyden), snidane: tt.snidane.slice(), vecere: (tt.vecere || []).slice(), vareni: tt.vareni.map(x => x.slice()), navyseni: { ...(tt.navyseni || {}) } });
      stav.sablony = stav.sablony.slice(0, 8); uloz(); toast('Uloženo. Příště ho vybereš jedním klepnutím.'); break;
    }
    case 'sablona': {
      const s = stav.sablony[+p[0]]; const tt = t();
      tt.snidane = s.snidane.slice(); tt.vecere = (s.vecere || []).slice(); tt.vareni = NASTAVENI.vareni.map((_, i) => (s.vareni[i] || []).slice()); tt.zmeny = {}; tt.navyseni = { ...(s.navyseni || {}) };
      uloz(); ui.krok = PREHLED; nahoru(); break;
    }
    case 'sdilet': sdilet(); return;
  }
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });

function sdilet() {
  const t = zobrazenyTyden(ui.tyden);
  let txt = `Nákup na týden ${rozsah(ui.tyden)}\n`;
  nakup(t).forEach(g => {
    const pol = g.polozky.filter(p => !t.nakup[p.k]); if (!pol.length) return;
    txt += `\n${g.o}\n` + pol.map(p => `- ${S[p.k].n}${S[p.k].doma ? '' : ': ' + mnozstvi(p.k, p.g)}`).join('\n') + '\n';
  });
  if (navigator.share) navigator.share({ text: txt }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Seznam je zkopírovaný')).catch(() => toast('Seznam se nepodařilo zkopírovat'));
}

render();
</script>
